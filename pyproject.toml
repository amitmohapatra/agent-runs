[project]
name = "agent-runs"
version = "0.3.2"
description = "Durable agent runs, the worker queue, the human inbox and the schedules that start runs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.0.53,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "alembic>=1.20,<2",
  "structlog>=25.2",
  "croniter>=6",
  "httpx>=0.28",
  "trellis-contracts>=0.4,<0.6",
  # the SDK (sdk/python, a workspace member): the service signs webhooks with its ``sign``
  "trellis-runs",
  "google-cloud-storage>=3.4",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.6",
  "pyright>=1.1.400",
  # the SDK's suite (sdk/python/tests): HTTP mocks and the OpenAPI schema checks
  "respx>=0.22",
  "jsonschema>=4.23",
]

[project.scripts]
agent-runs = "agent_runs.__main__:main"
agent-runs-ticker = "agent_runs.ticker:main"

[tool.uv.sources]
# The sibling checkout, not a vendored copy. The image build gets it as a named build
# context (`contracts`, see docker-compose.yml and the Makefile), placed at /agent-contracts
# next to /app, so this relative path resolves the same way inside and outside Docker.
trellis-contracts = { path = "../agent-contracts", editable = true }
trellis-runs = { workspace = true }

[tool.uv.workspace]
# trellis-runs, the Python SDK (``trellis.runs``), lives beside the service it speaks to
members = ["sdk/python"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# PLR2004: in a test the literal IS the assertion. PLC0415: conftest imports psycopg inside
# the probe so collection still works (and skips with a reason) without PostgreSQL.
"tests/**" = ["PLR2004", "PLC0415"]
# PLR0913/PLR0917: FastAPI expresses query parameters (filters, cursor, limit) as function
# arguments, and the list filters are keyword-only and optional in the store.
"src/agent_runs/api/routers/*.py" = ["PLR0913", "PLR0917"]
"src/agent_runs/store/runs.py" = ["PLR0913"]
"src/agent_runs/store/artifacts.py" = ["PLR0913"]
# A problem has nine members; its builders take them by keyword.
"src/agent_runs/api/errors.py" = ["PLR0913"]
# The ticker takes its collaborators, and the deployment's limits by keyword.
"src/agent_runs/ticker.py" = ["PLR0913"]
# The SDK's listings take their filters as keyword arguments, as the routes do.
"sdk/python/src/trellis/runs/*.py" = ["PLR0913"]
# The SDK's tests as the service's (PLR2004), and test doubles that take what its calls take.
"sdk/python/tests/**" = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# the service's suite; the SDK's (sdk/python/tests) runs on its own, with its own coverage gate
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
# SQLAlchemy's asyncio layer runs the driver in greenlets; without this, coverage loses
# track of every line after the first database await and reports them as never run.
concurrency = ["greenlet", "thread"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "sdk/python/src", "sdk/python/tests"]
typeCheckingMode = "standard"
