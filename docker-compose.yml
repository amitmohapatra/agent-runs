# The whole service: its database, the one-shot migration, the API and the ticker.
# `make up` builds and starts it. Point RUNS__DATABASE__URL at your own database and drop the
# postgres service when you have one.

name: agent-runs

x-image: &image
  build:
    context: .
    # trellis-contracts, a path dependency on the sibling checkout (see the Dockerfile)
    additional_contexts:
      contracts: ../agent-contracts
  image: agent-runs:dev

x-env: &env
  RUNS__DATABASE__URL: postgresql+psycopg://memory:memory@postgres:5432/agent_runs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: agent_runs
    ports:
      - "${RUNS_DB_PORT:-5442}:5432"
    volumes:
      - runs-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d agent_runs"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # One shot that the API and the ticker wait for: migrating from inside a process would
    # have replicas racing to apply the same revision.
    <<: *image
    command: ["alembic", "upgrade", "head"]
    environment: *env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *image
    environment:
      <<: *env
      RUNS__SERVICE__PORT: "8090"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RUNS_PORT:-8090}:8090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ticker:
    # Schedules, lapsed leases and overdue interrupts. One is plenty; more are harmless.
    <<: *image
    command: ["agent-runs-ticker"]
    environment: *env
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "agent_runs.heartbeat"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  runs-db:
